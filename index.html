<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Chatbot</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 400px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .chat-box { height: 300px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; border-radius: 5px; background: #fafafa; }
        .message { margin: 5px 0; padding: 8px; border-radius: 5px; }
        .user { background: #d1e7dd; text-align: right; }
        .ai { background: #e2e3e5; text-align: left; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 15px; background: #0d6efd; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0b5ed7; }
    </style>
</head>
<body>

<div class="chat-container">
    <h2>My AI Assistant 🤖</h2>
    <div class="chat-box" id="chatBox"></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask something...">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const inputField = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');
        const message = inputField.value.trim();
        
        if (!message) return;

        // User ka message screen par dikhao
        chatBox.innerHTML += `<div class="message user">${message}</div>`;
        inputField.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            // Yahan aapki working live API link set hai
        const response = await fetch('https://vercel.app', {

                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            });

            const data = await response.json();
            
            // AI ka reply screen par dikhao
            if (data.reply) {
                chatBox.innerHTML += `<div class="message ai">${data.reply}</div>`;
            } else {
                chatBox.innerHTML += `<div class="message ai" style="color:red;">Error: ${data.error || 'Something went wrong'}</div>`;
            }
        } catch (error) {
            chatBox.innerHTML += `<div class="message ai" style="color:red;">Server se connect nahi ho paya!</div>`;
        }
        
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
